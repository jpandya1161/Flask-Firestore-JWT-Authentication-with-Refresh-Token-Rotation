<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - JWT Refresh Demo</title>
    <script src="https://www.google.com/search?q=https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md bg-white p-8 rounded-xl">
      <h2 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">
        Secure Login
      </h2>
      <p class="text-center text-sm text-gray-600 mb-6">
        Log in with your registered credentials.
      </p>
      <form id="loginForm" class="space-y-6">
        <div>
          <label
            for="username"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Username</label
          >
          <input
            id="username"
            name="username"
            type="text"
            required
            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150"
          />
        </div>
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <input
            id="password"
            name="password"
            type="password"
            required
            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150"
          />
        </div>

        <button
          type="submit"
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150"
        >
          Log In
        </button>
      </form>
      <p
        id="message"
        class="mt-4 text-center text-sm font-medium"
        style="display: none"
      ></p>

      <div class="mt-6 text-center">
        <a
          href="{{ url_for('register') }}"
          class="font-medium text-green-600 hover:text-green-500"
        >
          Need an account? Register Here
        </a>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
