<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - JWT Refresh Demo</title>
    <script src="https://www.google.com/search?q=https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md bg-white p-8 rounded-xl">
      <h2 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">
        Register New User
      </h2>

      <form id="registerForm" class="space-y-6">
        <div>
          <label
            for="username"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Username</label
          >
          <input
            id="username"
            name="username"
            type="text"
            required
            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm transition duration-150"
          />
        </div>
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <input
            id="password"
            name="password"
            type="password"
            required
            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm transition duration-150"
          />
        </div>

        <button
          type="submit"
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150"
        >
          Register
        </button>
      </form>
      <p
        id="message"
        class="mt-4 text-center text-sm font-medium"
        style="display: none"
      ></p>

      <div class="mt-6 text-center">
        <a
          href="{{ url_for('index') }}"
          class="font-medium text-blue-600 hover:text-blue-500"
        >
          Go to Login
        </a>
      </div>
    </div>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const messageEl = document.getElementById("message");
          messageEl.style.display = "block";
          messageEl.className =
            "mt-4 text-center text-sm font-medium text-gray-600";
          messageEl.textContent = "Registering user...";

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          try {
            const response = await fetch("/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });

            const data = await response.json();

            if (response.ok) {
              messageEl.textContent = data.message;
              messageEl.className =
                "mt-4 text-center text-sm font-medium text-green-600";
            } else {
              messageEl.textContent = data.message || "Registration failed.";
              messageEl.className =
                "mt-4 text-center text-sm font-medium text-red-600";
            }
          } catch (error) {
            messageEl.textContent = "Network error during registration.";
            messageEl.className =
              "mt-4 text-center text-sm font-medium text-red-600";
            console.error("Error:", error);
          }
        });
    </script>
  </body>
</html>
